{{define "layout"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}MCPanel{{end}}</title>
  <meta name="description" content="Minecraft Plugin Development Control Panel">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/static/css/style.css?v=15">
  <script>window.CSRF = {{.CSRF}};</script>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar">
    <a href="/" class="sidebar-brand" style="text-decoration:none;color:inherit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
        <path d="M7 7h.01M11 7h2M7 11h2M13 11h.01"/>
      </svg>
      <span class="sidebar-brand-name">MC<span>Panel</span></span>
    </a>

    <nav class="sidebar-nav">
      <div class="sidebar-section">Servers</div>
      <a href="/servers/new" class="nav-item sidebar-create-server {{if eq .ActiveNav "new-server"}}active{{end}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>
        </svg>
        <span>New Server</span>
      </a>
      {{block "sidebar-servers" .}}{{end}}

      <div class="divider"></div>
      <div class="sidebar-section">Development</div>
      <a href="/projects" class="nav-item {{if eq .ActiveNav "projects"}}active{{end}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        <span>Plugin Projects</span>
      </a>

      <div class="divider"></div>
      <div class="sidebar-section">System</div>
      <a href="/settings" class="nav-item {{if eq .ActiveNav "settings"}}active{{end}}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Global Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <form method="post" action="/logout" style="margin:0">
        <input type="hidden" name="_csrf" value="{{.CSRF}}">
        <button type="submit" class="btn btn-ghost btn-sm w-full" style="justify-content:center;gap:6px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          <span>Sign out</span>
        </button>
      </form>
    </div>
  </aside>

  <div class="main">
    {{template "content" .}}
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toast-container"></div>

<!-- Server context menu -->
<div class="server-context-menu" id="server-context-menu" role="menu" hidden>
  <button type="button" class="server-context-item" data-server-menu-action="rename" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    Rename
  </button>
  <button type="button" class="server-context-item" data-server-menu-action="copy-path" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>
    Copy path
  </button>
  <div class="server-context-separator"></div>
  <button type="button" class="server-context-item" data-server-menu-action="start" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="7 4 20 12 7 20 7 4"/></svg>
    Start
  </button>
  <button type="button" class="server-context-item" data-server-menu-action="restart" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.5 15a9 9 0 1 0 .5-3.1"/></svg>
    Restart
  </button>
  <button type="button" class="server-context-item" data-server-menu-action="stop" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
    Stop
  </button>
  <div class="server-context-separator"></div>
  <div class="server-context-label">Highlight</div>
  <div class="server-highlight-palette" aria-label="Server highlight color">
    <button type="button" class="server-highlight-swatch" data-server-highlight="#ef5350" style="--swatch:#ef5350" title="Red" aria-label="Highlight red"></button>
    <button type="button" class="server-highlight-swatch" data-server-highlight="#d99a2b" style="--swatch:#d99a2b" title="Amber" aria-label="Highlight amber"></button>
    <button type="button" class="server-highlight-swatch" data-server-highlight="#2fbf91" style="--swatch:#2fbf91" title="Green" aria-label="Highlight green"></button>
    <button type="button" class="server-highlight-swatch" data-server-highlight="#4d8ff7" style="--swatch:#4d8ff7" title="Blue" aria-label="Highlight blue"></button>
    <button type="button" class="server-highlight-swatch" data-server-highlight="#9b6de3" style="--swatch:#9b6de3" title="Purple" aria-label="Highlight purple"></button>
    <button type="button" class="server-highlight-swatch" data-server-highlight="#e847a8" style="--swatch:#e847a8" title="Pink" aria-label="Highlight pink"></button>
  </div>
  <button type="button" class="server-context-item" data-server-menu-action="reset-highlight" role="menuitem">Reset highlight</button>
  <div class="server-context-separator"></div>
  <button type="button" class="server-context-item danger" data-server-menu-action="delete" role="menuitem">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="m19 6-1 14H6L5 6m4 0V4h6v2"/></svg>
    Delete
  </button>
</div>

<script>
// ── Global utilities ──────────────────────────────────────────

function toast(msg, type='info') {
  const icons = {
    success: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    error:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
    info:    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>',
  };
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `${icons[type]||icons.info} <span>${msg}</span>`;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

async function api(url, method='GET', body=null) {
  const opts = { method, headers: {} };
  if (body !== null) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  return await fetch(url, opts);
}

// Sidebar grouping
document.addEventListener('DOMContentLoaded', () => {
  const container = document.querySelector('.sidebar-nav');
  const servers = [...container.querySelectorAll('a.nav-item:not(.sidebar-create-server)')].filter(el => el.getAttribute('href') && el.getAttribute('href').startsWith('/servers/'));
  if (servers.length === 0) return;

  const groups = new Map();
  servers.forEach(el => {
    const nameSpan = el.querySelector('.truncate');
    if (!nameSpan) return;
    const name = nameSpan.textContent;
    const parts = name.split('/');
    const group = parts.length > 1 ? parts.shift() : 'Root';
    nameSpan.textContent = parts.join('/') || name;
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(el);
  });
  const serversHeader = [...container.querySelectorAll('.sidebar-section')].find(el => el.textContent === 'Servers');
  if (!serversHeader) return;
  const fragment = document.createDocumentFragment();
  for (const [folder, els] of groups) {
    const wrapper = document.createElement('div');
    wrapper.className = 'sidebar-folder';
    const header = document.createElement('button');
    header.type = 'button';
    header.className = 'sidebar-folder-header nav-item';
    header.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg><span class="truncate"></span>';
    header.querySelector('.truncate').textContent = folder;
    const content = document.createElement('div');
    content.className = 'sidebar-folder-content';
    els.forEach(el => content.appendChild(el));
    const stateKey = 'sidebar_group_open_' + folder;
    const savedState = localStorage.getItem(stateKey);
    const isOpen = savedState === null ? els.some(el => el.classList.contains('active')) : savedState === 'true';
    if (isOpen) {
      wrapper.classList.add('open');
    }
    header.addEventListener('click', () => {
      const current = wrapper.classList.toggle('open');
      localStorage.setItem(stateKey, current);
    });
    wrapper.appendChild(header);
    wrapper.appendChild(content);
    fragment.appendChild(wrapper);
  }
  servers.forEach(el => { if (el.parentElement === container) container.removeChild(el); });
  serversHeader.after(fragment);
});

// Server right-click context menu
let serverContextLink = null;
let serverContextName = '';
const serverContextMenu = document.getElementById('server-context-menu');
const serverHighlightKey = 'mcpanel.serverHighlights';

function serverNameFromLink(link) {
  const pathname = new URL(link.href, location.href).pathname;
  return decodeURIComponent(pathname.slice('/servers/'.length));
}

function loadServerHighlights() {
  try { return JSON.parse(localStorage.getItem(serverHighlightKey)) || {}; } catch (_) { return {}; }
}

function applyServerHighlights() {
  const highlights = loadServerHighlights();
  document.querySelectorAll('.sidebar-nav a.nav-item[href^="/servers/"]:not(.sidebar-create-server)').forEach(link => {
    const color = highlights[serverNameFromLink(link)];
    link.classList.toggle('server-highlighted', !!color);
    link.style.setProperty('--server-highlight', color || 'transparent');
    link.style.backgroundColor = color ? color + '20' : '';
  });
}

function setServerHighlight(name, color) {
  const highlights = loadServerHighlights();
  if (color) highlights[name] = color;
  else delete highlights[name];
  localStorage.setItem(serverHighlightKey, JSON.stringify(highlights));
  applyServerHighlights();
}

function closeServerContextMenu() {
  serverContextMenu.hidden = true;
  serverContextLink = null;
  serverContextName = '';
}

function openServerContextMenu(event, link) {
  event.preventDefault();
  serverContextLink = link;
  serverContextName = serverNameFromLink(link);
  const online = link.classList.contains('status-online');
  serverContextMenu.querySelector('[data-server-menu-action="start"]').hidden = online;
  serverContextMenu.querySelector('[data-server-menu-action="stop"]').hidden = !online;
  serverContextMenu.querySelector('[data-server-menu-action="restart"]').hidden = !online;
  serverContextMenu.hidden = false;
  serverContextMenu.style.left = '0px';
  serverContextMenu.style.top = '0px';
  const rect = serverContextMenu.getBoundingClientRect();
  const left = Math.max(8, Math.min(event.clientX, window.innerWidth - rect.width - 8));
  const top = Math.max(8, Math.min(event.clientY, window.innerHeight - rect.height - 8));
  serverContextMenu.style.left = left + 'px';
  serverContextMenu.style.top = top + 'px';
  serverContextMenu.querySelector('.server-context-item:not([hidden])')?.focus();
}

async function serverContextLifecycle(name, action) {
  const response = await fetch(`/api/servers/${encodeURIComponent(name)}/${action}`, {
    method: 'POST', headers: {'X-CSRF-Token': window.CSRF}
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `${action} failed`);
  toast(`${name}: ${action} issued`, 'success');
  setTimeout(() => location.reload(), 700);
}

document.addEventListener('contextmenu', event => {
  const link = event.target.closest('.sidebar-nav a.nav-item[href^="/servers/"]:not(.sidebar-create-server)');
  if (link) openServerContextMenu(event, link);
});

document.addEventListener('click', event => {
  if (!serverContextMenu.hidden && !serverContextMenu.contains(event.target)) closeServerContextMenu();
});
window.addEventListener('blur', closeServerContextMenu);
window.addEventListener('resize', closeServerContextMenu);
document.querySelector('.sidebar-nav')?.addEventListener('scroll', closeServerContextMenu, {passive:true});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !serverContextMenu.hidden) {
    event.preventDefault();
    closeServerContextMenu();
  }
});

serverContextMenu.querySelectorAll('[data-server-highlight]').forEach(button => {
  button.addEventListener('click', () => {
    setServerHighlight(serverContextName, button.dataset.serverHighlight);
    closeServerContextMenu();
  });
});

serverContextMenu.addEventListener('click', async event => {
  const item = event.target.closest('[data-server-menu-action]');
  if (!item || !serverContextName) return;
  const action = item.dataset.serverMenuAction;
  const name = serverContextName;
  try {
    if (action === 'reset-highlight') {
      setServerHighlight(name, '');
      closeServerContextMenu();
      return;
    }
    if (action === 'copy-path') {
      const response = await fetch(`/api/servers/${encodeURIComponent(name)}/info`);
      if (!response.ok) throw new Error(await response.text());
      const info = await response.json();
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(info.path);
      } else {
        const input = document.createElement('textarea');
        input.value = info.path;
        input.style.position = 'fixed';
        input.style.opacity = '0';
        document.body.appendChild(input);
        input.select();
        document.execCommand('copy');
        input.remove();
      }
      toast('Server path copied', 'success');
      closeServerContextMenu();
      return;
    }
    if (action === 'rename') {
      const currentBase = name.split('/').pop();
      const newBase = prompt('Rename server to:', currentBase);
      if (!newBase || newBase === currentBase) return;
      const response = await fetch('/api/servers/manage', {
        method: 'POST', headers: {'Content-Type':'application/json','X-CSRF-Token':window.CSRF},
        body: JSON.stringify({action:'rename', name, newName:newBase})
      });
      if (!response.ok) throw new Error((await response.text()).trim());
      const result = await response.json();
      const highlights = loadServerHighlights();
      if (highlights[name]) {
        highlights[result.name] = highlights[name];
        delete highlights[name];
        localStorage.setItem(serverHighlightKey, JSON.stringify(highlights));
      }
      toast(`Renamed to ${result.name}`, 'success');
      location.assign(`/servers/${encodeURIComponent(result.name)}`);
      return;
    }
    if (action === 'delete') {
      if (!confirm(`Permanently delete server "${name}" and all files inside it?`)) return;
      const response = await fetch('/api/servers/manage', {
        method: 'POST', headers: {'Content-Type':'application/json','X-CSRF-Token':window.CSRF},
        body: JSON.stringify({action:'delete', name})
      });
      if (!response.ok) throw new Error((await response.text()).trim());
      setServerHighlight(name, '');
      toast(`Deleted ${name}`, 'success');
      location.assign('/');
      return;
    }
    if (action === 'start' || action === 'stop' || action === 'restart') {
      closeServerContextMenu();
      await serverContextLifecycle(name, action);
    }
  } catch (error) {
    toast(error.message || 'Server action failed', 'error');
    closeServerContextMenu();
  }
});

applyServerHighlights();

</script>
</body>
</html>
{{end}}
